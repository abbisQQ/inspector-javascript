<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Inspector-Javascript logo">
  <title>Inspector-Javascript</title>
  <defs>
    <linearGradient id="ijsLens" x1="52" y1="40" x2="150" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="ijsHandle" x1="150" y1="150" x2="214" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <radialGradient id="ijsGlass" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#0b1220" stop-opacity="0.0"/>
      <stop offset="1" stop-color="#0b1220" stop-opacity="0.18"/>
    </radialGradient>
  </defs>

  <!-- handle -->
  <rect x="150" y="150" width="74" height="26" rx="13"
        transform="rotate(45 150 150)" fill="url(#ijsHandle)"/>

  <!-- lens ring -->
  <circle cx="98" cy="98" r="70" fill="#0b1220"/>
  <circle cx="98" cy="98" r="70" fill="url(#ijsGlass)"/>
  <circle cx="98" cy="98" r="70" fill="none" stroke="url(#ijsLens)" stroke-width="12"/>

  <!-- code braces + scan cursor inside the lens: the "JS inspector" mark -->
  <g stroke="#5eead4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M78 74 q-16 0 -16 16 q0 8 -8 8 q8 0 8 8 q0 16 16 16"/>
    <path d="M118 74 q16 0 16 16 q0 8 8 8 q-8 0 -8 8 q0 16 -16 16"/>
  </g>
  <rect x="94" y="88" width="8" height="22" rx="2" fill="#f5f9ff">
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- glint -->
  <path d="M64 70 q10 -16 30 -20" stroke="#ffffff" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round" fill="none"/>
</svg>
